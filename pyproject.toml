[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalisin"
version = "0.2.0"
description = "Python client for the Cosinner API"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "KALISIN", email = "hello@kalisin.com"}]
dependencies = ["httpx>=0.24.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0"]

[project.urls]
Homepage = "https://kalisin.com"
Documentation = "https://platform.cosinner.com/docs"
Repository = "https://github.com/erhan1209/kalisin-python"

[tool.setuptools.packages.find]
include = ["kalisin*"]
exclude = ["tests*", "examples*"]
